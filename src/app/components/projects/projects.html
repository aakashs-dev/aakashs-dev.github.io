<div class="projects-container">
  <div class="projects-header">
    <h2 class="section-title">Portfolio</h2>
    <p class="section-subtitle">A selection of my recent work across data and software engineering.</p>
  </div>

  <div class="projects-grid">
    @for (project of projects; track project.title) {
      <div class="project-card">
        <div class="project-content">
          <h3 class="project-title">{{ project.title }}</h3>
          <p class="project-description">{{ project.description }}</p>
          
          <div class="project-tech">
            @for (tech of project.technologies; track tech) {
              <span class="tech-tag">{{ tech }}</span>
            }
          </div>
        </div>
        
        <div class="project-links">
          <a [href]="project.githubLink" class="btn-link" target="_blank">
            <span class="icon">⎇</span> GitHub
          </a>
          <a [href]="project.liveLink" class="btn-link live-link" target="_blank">
            <span class="icon">↗</span> Live Demo
          </a>
        </div>
      </div>
    }
  </div>
</div>
