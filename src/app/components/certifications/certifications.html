<div class="cert-container">
  <div class="cert-header">
    <h2 class="section-title">Certifications</h2>
    <p class="section-subtitle">Professional credentials and exams passed.</p>
  </div>

  <div class="cert-grid">
    @for (cert of certifications; track cert.title) {
      <div class="cert-card">
        <div class="cert-icon">
          <span class="icon">🎓</span>
        </div>
        <div class="cert-content">
          <h3 class="cert-title">{{ cert.title }}</h3>
          <div class="cert-issuer">{{ cert.issuer }}</div>

          <div class="cert-details">
            <span class="cert-date">Passed {{ cert.date }}</span>
            @if (cert.credentialId) {
              <span class="cert-divider">•</span>
              <span class="cert-id">Credential ID: {{ cert.credentialId }}</span>
            }
          </div>

          @if (cert.credentialUrl) {
            <a [href]="cert.credentialUrl" class="verify-btn" target="_blank" rel="noopener">
              Verify Credential <span class="arrow">→</span>
            </a>
          }
        </div>
      </div>
    }
  </div>
</div>
