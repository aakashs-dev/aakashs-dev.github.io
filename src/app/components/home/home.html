<div class="home-container">
  <!-- Hero Section -->
  <section id="home" class="hero-section" [attr.data-hero-season]="activeSkylineScene()">
    <app-pixel-skyline [selection]="skylineSelection()" />
    <div class="hero-overlay" aria-hidden="true"></div>
    <app-hero-weather [season]="activeWeatherSeason()" />
    <div class="hero-content">
      <app-pixel-blimp [holiday]="activeSkylineHoliday()" />
      <p class="hero-greeting">You've reached</p>
      <h1 class="hero-title">Aakash Sharma</h1>
      <p class="hero-subtitle">
        <span class="role-label">Data Analyst</span><span class="role-sep" aria-hidden="true">{{ ' | ' }}</span><span class="role-label">Software Engineer</span>
      </p>
      <p class="hero-summary">
        Building market-data pipelines, financial analytics and software in Melbourne.
      </p>
      <div class="hero-actions">
        <a href="#portfolio" class="hero-btn primary" (click)="onHeroCtaClick('portfolio')">
          View Portfolio <span aria-hidden="true">→</span>
        </a>
        <a href="#resume" class="hero-btn secondary" (click)="onHeroCtaClick('resume')">
          Resume
        </a>
      </div>
    </div>

    <div class="skyline-control">
      <label for="skyline-scene" class="scene-label">Skyline</label>
      <select
        id="skyline-scene"
        name="skyline-scene"
        class="scene-select"
        [value]="skylineSelection()"
        (change)="onSkylineChange($event)"
      >
        <option value="auto">Auto ({{ autoSkylineLabel }})</option>
        @for (opt of skylineOptions; track opt.id) {
          <option [value]="opt.id">{{ opt.label }}</option>
        }
      </select>
    </div>
  </section>

  <!-- Content Sections -->
  <section id="about" class="page-section">
    <app-about></app-about>
  </section>
  <section id="resume" class="page-section">
    <app-resume></app-resume>
  </section>
  <section id="portfolio" class="page-section">
    <app-projects></app-projects>
  </section>
  <section id="certifications" class="page-section">
    <app-certifications></app-certifications>
  </section>
  <section id="contact" class="page-section">
    <app-contact></app-contact>
  </section>
</div>
