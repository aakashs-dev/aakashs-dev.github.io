<svg
  class="pixel-skyline-svg"
  [attr.data-season]="activeSeason()"
  [attr.data-holiday]="activeHoliday()"
  viewBox="0 0 240 135"
  preserveAspectRatio="xMidYMax slice"
  shape-rendering="crispEdges"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <!-- 2x2 ordered Bayer pixel dithers -->
    <pattern id="px-dither-sky2-25" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" class="sky-2" />
      <rect x="2" y="2" width="1" height="1" class="sky-2" />
    </pattern>
    <pattern id="px-dither-sky2-50" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" class="sky-2" />
      <rect x="1" y="1" width="1" height="1" class="sky-2" />
    </pattern>
    <pattern id="px-dither-sky3-25" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" class="sky-3" />
      <rect x="2" y="2" width="1" height="1" class="sky-3" />
    </pattern>
    <pattern id="px-dither-sky3-50" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" class="sky-3" />
      <rect x="1" y="1" width="1" height="1" class="sky-3" />
    </pattern>
    <pattern id="px-dither-sky4-50" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" class="sky-4" />
      <rect x="1" y="1" width="1" height="1" class="sky-4" />
    </pattern>
    <pattern id="px-dither-fade-25" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" class="canvas-fill" />
      <rect x="2" y="2" width="1" height="1" class="canvas-fill" />
    </pattern>
    <pattern id="px-dither-fade-50" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" class="canvas-fill" />
      <rect x="1" y="1" width="1" height="1" class="canvas-fill" />
    </pattern>
    <radialGradient id="px-sun-ray-core" cx="206" cy="18" r="138" gradientUnits="userSpaceOnUse">
      <stop offset="0%" class="sun-ray-stop" stop-opacity="0.30" />
      <stop offset="42%" class="sun-ray-stop" stop-opacity="0.14" />
      <stop offset="100%" class="sun-ray-stop" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="px-sun-ray-soft" cx="206" cy="18" r="138" gradientUnits="userSpaceOnUse">
      <stop offset="0%" class="sun-ray-stop" stop-opacity="0.18" />
      <stop offset="48%" class="sun-ray-stop" stop-opacity="0.08" />
      <stop offset="100%" class="sun-ray-stop" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Stepped Bayer-dithered sky bands -->
  <rect x="0" y="0" width="240" height="135" class="sky-1" />
  <rect x="0" y="34" width="240" height="4" fill="url(#px-dither-sky2-25)" />
  <rect x="0" y="38" width="240" height="4" fill="url(#px-dither-sky2-50)" />
  <rect x="0" y="42" width="240" height="68" class="sky-2" />
  <rect x="0" y="64" width="240" height="4" fill="url(#px-dither-sky3-25)" />
  <rect x="0" y="68" width="240" height="4" fill="url(#px-dither-sky3-50)" />
  <rect x="0" y="72" width="240" height="38" class="sky-3" />
  <rect x="0" y="90" width="240" height="4" fill="url(#px-dither-sky4-50)" />
  <rect x="0" y="94" width="240" height="16" class="sky-4" />

  @if (activeHoliday() === 'default' && activeSeason() === 'summer') {
    <g class="sun-beams" shape-rendering="auto">
      <g class="sun-beams-a">
        <path
          fill="url(#px-sun-ray-soft)"
          d="M206 18L0 58v31zM206 18L100 110h31zM206 18L229 110h18z"
        />
        <path
          fill="url(#px-sun-ray-core)"
          d="M206 18L0 65v16zM206 18L109 110h16zM206 18L233 110h9z"
        />
      </g>
      <g class="sun-beams-b">
        <path
          fill="url(#px-sun-ray-soft)"
          d="M206 18L9 110h61zM206 18L151 110h20z"
        />
        <path
          fill="url(#px-sun-ray-core)"
          d="M206 18L29 110h27zM206 18L156 110h10z"
        />
      </g>
    </g>
  }

  <!-- Base Day/Night celestial bodies (flip via CSS light-dark()) -->
  <g class="day-celestial">
    @if (activeHoliday() !== 'halloween') {
      <path
        class="sun-halo"
        d="M203 11h6v1h2v1h1v2h1v6h-1v2h-1v1h-2v1h-6v-1h-2v-1h-1v-2h-1v-6h1v-2h1v-1h2z"
      />
      <path
        class="sun-core"
        d="M204 13h4v1h2v2h1v4h-1v2h-2v1h-4v-1h-2v-2h-1v-4h1v-2h2z"
      />
    }
    <path class="cloud" d="M134 22h10v1h4v1h3v2h-22v-2h2v-1h3z" />
    <path class="cloud" d="M180 35h12v1h5v1h3v2h-25v-2h2v-1h3z" />
    <path class="cloud-faint" d="M34 16h8v1h3v1h2v2h-17v-2h2v-1h2z" />
  </g>

  <g class="night-celestial">
    @if (activeHoliday() !== 'halloween') {
      <path
        class="moon"
        d="M206 16h4v1h-2v1h-1v2h-1v4h1v2h1v1h2v1h-4v-1h-2v-2h-1v-6h1v-2h2z"
      />
    }
    <path
      class="star-bright"
      d="M148 15h1v1h-1zM147 16h3v1h-3zM148 17h1v1h-1z
         M224 27h1v1h-1zM223 28h3v1h-3zM224 29h1v1h-1z
         M178 12h1v1h-1zM177 13h3v1h-3zM178 14h1v1h-1z"
    />
    <path
      class="star-dim"
      d="M124 20h1v1h-1zM136 28h1v1h-1zM164 22h1v1h-1zM188 26h1v1h-1z
         M216 14h1v1h-1zM232 19h1v1h-1zM112 13h1v1h-1zM96 18h1v1h-1z
         M168 35h1v1h-1zM212 38h1v1h-1zM68 12h1v1h-1zM44 17h1v1h-1z"
    />
  </g>

  <!-- 2. SLOT A: Upper-Right Sky Stage (holiday sky sprites; x >= 140 stays clear of hero text) -->
  @if (activeHoliday() === 'default' || activeHoliday() === 'christmas') {
    <!-- Crisp pixel sky birds (morph into bats at the same positions during Halloween) -->
    <g class="sky-birds">
      <path
        class="bird"
        d="M153 20h2v1h1v1h2v-1h1v-1h2v1h-2v1h-1v1h-2v-1h-1v-1h-2z
           M174 15h2v1h1v1h1v-1h1v-1h2v1h-2v1h-1v1h-1v-1h-1v-1h-2z
           M187 26h1v1h2v1h1v-1h2v-1h1v1h-2v1h-1v1h-1v-1h-1v-1h-2z"
      />
    </g>
  }
  @switch (activeHoliday()) {
    @case ('default') {
      <g [class]="'overlay-sky overlay-season-' + activeSeason()">
        @switch (activeSeason()) {
          @case ('summer') {
            <!-- Blazing Melbourne summer sun corona ticks & extra bay gulls -->
            <path
              class="sun-halo"
              d="M205 7h2v3h-2zM205 26h2v3h-2zM195 17h3v2h-3zM214 17h3v2h-3z
                 M198 10h2v2h-2zM212 10h2v2h-2zM198 24h2v2h-2zM212 24h2v2h-2z"
            />
            <path class="bird" d="M146 28h2v1h1v1h1v-1h2v-1h1v1h-2v1h-3v-1h-2zM196 38h2v1h1v1h1v-1h2v-1h-2v1h-2v-1z" />
          }
          @case ('autumn') {
            <!-- Windblown amber & crimson autumn leaves drifting across the sky -->
            <path class="fx-amber" d="M122 44h2v1h-2zM148 52h2v1h-2zM176 46h2v1h-2zM214 54h2v1h-2z" />
            <path class="fx-crimson" d="M135 58h2v1h-2zM163 40h2v1h-2zM196 49h2v1h-2z" />
          }
          @case ('winter') {
            <!-- Overcast Melbourne winter pixel cloud banks & subtle alpine frost flurries -->
            <path
              class="cloud-main"
              d="M20 11h8v1h4v2h6v2h-24v-2h3v-2h3v-1z
                 M65 15h9v1h5v2h7v3h-30v-2h4v-2h5v-2z
                 M122 18h10v2h7v2h7v3h-34v-2h4v-2h6v-3z
                 M204 22h10v2h7v2h7v2h-32v-2h4v-2h4v-2z"
            />
            <path
              class="cloud-shade"
              d="M14 16h24v1h-24zM56 21h30v1h-30zM112 25h34v1h-34zM196 28h32v1h-32z"
            />
            <path fill="var(--tree-frost)" d="M128 36h1v1h-1zM146 44h1v1h-1zM168 34h1v1h-1zM182 48h1v1h-1zM215 42h1v1h-1z" />
          }
          @case ('spring') {
            <!-- Spring shower pixel clouds, drifting cherry-blossom petals & 2 pixel butterflies -->
            <path
              class="cloud-main"
              d="M30 12h8v2h5v2h5v2h-26v-2h4v-2h4v-2z
                 M83 9h9v2h6v2h6v2h-30v-2h4v-2h5v-2z
                 M125 15h10v2h7v2h6v3h-32v-3h4v-2h5v-2z
                 M204 22h10v2h6v2h6v2h-30v-2h4v-2h4v-2z"
            />
            <path
              class="cloud-shade"
              d="M22 18h26v1h-26zM74 15h30v1h-30zM116 22h32v1h-32zM196 28h30v1h-30z"
            />
            <path fill="var(--tree-blossom)" d="M126 42h2v1h-2zM154 48h1v1h-1zM178 39h2v1h-2zM214 46h1v1h-1z" />
            <path class="fx-gold" d="M140 36h1v2h-1zM142 36h1v2h-1zM141 37h1v1h-1z" />
            <path class="fx-magenta" d="M168 44h1v2h-1zM170 44h1v2h-1zM169 45h1v1h-1z" />
          }
        }
      </g>
    }
    @case ('christmas') {
      <!-- Clean starry night sky (Santa's sleigh pulls the MERRY CHRISTMAS banner overhead at night) -->
      <g class="overlay-sky overlay-christmas">
        <path class="night-gold" d="M160 18h1v3h-1zM159 19h3v1h-3zM186 22h1v1h-1z" />
      </g>
    }
    @case ('new-year') {
      <g class="overlay-sky overlay-new-year">
        <!-- 2 iconic Melbourne pixel hot air balloons drifting past the fireworks -->
        <g class="ny-balloons">
          <!-- Hero striped balloon (x=168..174, y=26..36) -->
          <path class="fx-crimson" d="M169 26h5v1h1v4h-1v1h-5v-1h-1v-4h1z" />
          <path class="fx-gold" d="M170 26h1v6h-1zM172 26h1v6h-1zM168 28h7v1h-7z" />
          <rect x="171" y="33" width="1" height="1" class="fx-bright" />
          <path class="bridge" d="M170 34h1v1h-1zM172 34h1v1h-1zM170 35h3v2h-3z" />
          <!-- Second distant striped balloon (x=139..143, y=17..24) -->
          <path class="fx-gold" d="M140 17h3v1h1v3h-1v1h-3v-1h-1v-3h1z" />
          <path class="fx-crimson" d="M141 17h1v5h-1zM139 19h5v1h-5z" />
          <rect x="141" y="22" width="1" height="1" class="fx-bright" />
          <rect x="140" y="23" width="3" height="2" class="bridge" />
        </g>

        <!-- Firework 1 (gold burst at 158, 21) -->
        <path
          class="fx-gold"
          d="M158 15h1v2h-1zM158 25h1v2h-1zM152 20h2v1h-2zM163 20h2v1h-2z
             M154 16h1v1h-1zM162 16h1v1h-1zM154 24h1v1h-1zM162 24h1v1h-1z
             M156 18h1v1h-1zM160 18h1v1h-1zM156 22h1v1h-1zM160 22h1v1h-1z"
        />
        <rect x="158" y="20" width="1" height="1" class="fx-bright" />

        <!-- Firework 2 (crimson + gold burst at 184, 15) -->
        <path
          class="fx-crimson"
          d="M184 9h1v2h-1zM184 19h1v2h-1zM178 14h2v1h-2zM189 14h2v1h-2z
             M180 10h1v1h-1zM188 10h1v1h-1zM180 18h1v1h-1zM188 18h1v1h-1z"
        />
        <path
          class="fx-gold"
          d="M182 12h1v1h-1zM186 12h1v1h-1zM182 16h1v1h-1zM186 16h1v1h-1zM184 14h1v1h-1z"
        />

        <!-- Firework 3 (champagne + crimson burst at 222, 23) -->
        <path
          class="fx-gold"
          d="M222 18h1v2h-1zM222 26h1v2h-1zM217 22h2v1h-2zM226 22h2v1h-2z
             M219 19h1v1h-1zM225 19h1v1h-1zM219 25h1v1h-1zM225 25h1v1h-1z"
        />
        <rect x="222" y="22" width="1" height="1" class="fx-crimson" />
      </g>
    }
    @case ('diwali') {
      <g class="overlay-sky overlay-diwali">
        <!-- Night-only Indian Diwali fireworks: rising rockets & marigold/magenta/emerald willow sky shots -->
        <g class="diwali-night-fireworks">
          <!-- Soft night bloom halos behind bursts -->
          <path
            class="night-glow"
            d="M159 14h9v9h-9zM182 11h9v9h-9zM203 21h9v9h-9zM133 21h7v7h-7z"
          />

          <!-- Sky Shot 1: Grand Marigold-Gold & Rani-Magenta Chrysanthemum with rising rocket tail (163, 18) -->
          <path
            class="night-amber"
            d="M157 35h1v1h-1zM158 32h1v2h-1zM160 28h1v2h-1zM161 25h1v2h-1z"
          />
          <path
            class="night-magenta"
            d="M163 11h1v2h-1zM163 24h1v2h-1zM156 18h2v1h-2zM169 18h2v1h-2z
               M158 13h1v1h-1zM168 13h1v1h-1zM157 22h1v2h-1zM169 22h1v2h-1z
               M155 20h1v2h-1zM171 20h1v2h-1zM160 25h1v2h-1zM166 25h1v2h-1z"
          />
          <path
            class="night-gold"
            d="M163 14h1v2h-1zM163 21h1v2h-1zM159 18h2v1h-2zM166 18h2v1h-2z
               M160 15h1v1h-1zM166 15h1v1h-1zM160 21h1v1h-1zM166 21h1v1h-1z"
          />
          <path class="night-bright" d="M163 18h1v1h-1zM162 17h1v1h-1zM164 19h1v1h-1z" />

          <!-- Sky Shot 2: Emerald-Green & Saffron-Amber Rocket Burst (186, 15) -->
          <path class="night-gold" d="M182 29h1v2h-1zM184 24h1v2h-1zM185 21h1v1h-1z" />
          <path
            class="night-amber"
            d="M186 9h1v2h-1zM186 20h1v2h-1zM180 15h2v1h-2zM191 15h2v1h-2z
               M181 11h1v1h-1zM191 11h1v1h-1zM181 19h1v2h-1zM191 19h1v2h-1z"
          />
          <path
            class="night-emerald"
            d="M186 12h1v2h-1zM186 17h1v2h-1zM183 15h2v1h-2zM188 15h2v1h-2z
               M183 12h1v1h-1zM189 12h1v1h-1zM183 18h1v1h-1zM189 18h1v1h-1z"
          />
          <rect x="186" y="15" width="1" height="1" class="night-bright" />

          <!-- Sky Shot 3: Rani-Pink & Gold Crackle Burst over Southbank (207, 25) -->
          <path
            class="night-gold"
            d="M207 19h1v2h-1zM207 30h1v2h-1zM201 25h2v1h-2zM212 25h2v1h-2z
               M203 21h1v1h-1zM211 21h1v1h-1zM203 29h1v2h-1zM211 29h1v2h-1z"
          />
          <path
            class="night-magenta"
            d="M207 22h1v2h-1zM207 27h1v2h-1zM204 25h2v1h-2zM209 25h2v1h-2z
               M205 23h1v1h-1zM209 23h1v1h-1zM205 27h1v1h-1zM209 27h1v1h-1z"
          />
          <rect x="207" y="25" width="1" height="1" class="night-bright" />

          <!-- Sky Shot 4: Golden Rocket Crackle over Arts Centre (136, 24) -->
          <path class="night-amber" d="M133 35h1v2h-1zM135 30h1v2h-1z" />
          <path
            class="night-gold"
            d="M136 20h1v2h-1zM136 27h1v2h-1zM132 24h2v1h-2zM139 24h2v1h-2z
               M133 21h1v1h-1zM139 21h1v1h-1zM133 27h1v1h-1zM139 27h1v1h-1z"
          />
          <rect x="136" y="24" width="1" height="1" class="night-bright" />
        </g>

        <!-- 4 floating pixel sky lanterns drifting in the upper-right sky -->
        <path
          class="fx-amber"
          d="M151 22h3v4h-3zM173 14h3v4h-3zM193 26h3v4h-3zM219 18h3v4h-3z"
        />
        <path
          class="fx-crimson"
          d="M151 22h3v1h-3zM173 14h3v1h-3zM193 26h3v1h-3zM219 18h3v1h-3z"
        />
        <path
          class="fx-bright"
          d="M152 24h1v2h-1zM174 16h1v2h-1zM194 28h1v2h-1zM220 20h1v2h-1z"
        />
      </g>
    }
    @case ('halloween') {
      <g class="overlay-sky overlay-halloween">
        <!-- Large luminous harvest moon -->
        <path
          class="fx-amber"
          d="M202 12h8v1h2v1h1v2h1v6h-1v2h-1v1h-2v1h-8v-1h-2v-1h-1v-2h-1v-6h1v-2h1v-1h2z"
        />
        <path
          class="fx-gold"
          d="M203 14h6v1h2v2h1v4h-1v2h-2v1h-6v-1h-2v-2h-1v-4h1v-2h2z"
        />
        <!-- 3 crisp winged pixel bats -->
        <path
          class="skyline-near"
          d="M153 20h2v1h1v1h2v-1h1v-1h2v2h-2v1h-4v-1h-2z
             M174 15h2v1h1v1h1v-1h1v-1h2v1h-1v2h-5v-2h-1z
             M187 26h1v1h2v1h1v-1h2v-1h1v2h-2v1h-3v-1h-2z"
        />
      </g>
    }
  }

  <!-- 3. Far silhouette layer (kept deliberately low across x=94..132 behind Fed Square) -->
  <path
    class="skyline-far"
    d="M0 108V99h7v-3h5v3h3v-11h1v11h4v-11h1v11h6v-3h9v2h9v-5h12v4h14v-7h12v6h11v6h38v-8h10v-12h12v6h10v-16h11v10h12v-18h11v12h12v-10h11v14h10v8h9v6V108z"
  />

  <!-- 4. Foreground Melbourne landmarks (balanced with Fed Square Civic Plaza at x=94..132) -->
  <g class="skyline-near">
    <!-- Left crop-safe Docklands promenade & trees (x=0..52) -->
    <path d="M0 108V101h8v-2h9v2h11v-3h12v3h12v7z" />

    <!-- Flinders Street Station (x=54..91): facade, turrets, clocktower -->
    <path d="M54 108V91h3v-3h4v3h5v-3h12v3h4v-3h3v-10h2v-2h2v2h2v30z" />

    <!-- Arts Centre Melbourne (x=135..152): plinth, flared skirt, slender spire -->
    <path
      d="M135 108V96h2v-3h1v-3h1v-4h1v-5h1v-6h1v-12h1v-24h1v24h1v12h1v6h1v5h1v4h1v3h1v3h2v12z"
    />

    <!-- 101 Collins Street (x=154..166) -->
    <path d="M154 108V65h2v-4h2v-3h2v-8h1v8h2v3h1v4h2v43z" />

    <!-- Rialto Twin Towers (x=169..182) -->
    <path d="M169 108V61h2v-3h4v3h2v6h3v3h2v38z" />

    <!-- Eureka Tower (x=185..196): full stone frame to stepped parapet + slender mast -->
    <path d="M185 108V40h2v-1h7v1h2v68zM190 34h1v5h-1z" />

    <!-- Australia 108 (x=200..212): tallest tower with sleek stepped crown -->
    <path d="M200 108V35h2v-2h8v2h2v73zM205 32h2v1h-2z" />

    <!-- Right crop-safe Royal Botanic Gardens stepped treeline (x=215..240) -->
    <path d="M215 108V99h4v-3h6v3h4v-2h5v2h6v9z" />
  </g>

  <!-- Signature Melbourne terracotta-gold landmark accents -->
  <g class="skyline-accent">
    <!-- Flinders Street copper dome + finial -->
    <path d="M71 79h1v2h-1zM69 81h5v2h-5zM67 83h9v3h-9zM65 86h13v4h-13z" />
    <!-- Arts Centre spire beacon tip -->
    <rect x="143" y="37" width="1" height="2" />
    <!-- Eureka Tower inset gold-glass upper floors (horizontal louver bands, no solid hat) -->
    <path d="M186 41h8v1h-8zM186 43h8v1h-8zM186 45h8v1h-8zM186 47h8v1h-8z" />
    <!-- Australia 108 sleek faceted golden Starburst sky-lobby (1px overhang + glass band) -->
    <path d="M200 55h12v1h1v3h-1v1h-12v-1h-1v-3h1z" />
  </g>

  <!-- Eureka Tower signature slender vertical crimson accent line -->
