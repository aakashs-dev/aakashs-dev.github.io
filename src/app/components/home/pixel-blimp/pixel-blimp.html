@if (layout(); as b) {
  <div class="blimp-banner" [attr.data-holiday]="holiday()">
    <svg
      class="blimp-svg"
      [attr.viewBox]="'0 0 ' + b.totalWidth + ' ' + b.viewHeight"
      [attr.width]="b.totalWidth * 3"
      [attr.height]="b.viewHeight * 3"
      shape-rendering="crispEdges"
      role="img"
      [attr.aria-label]="b.text"
    >
      <!-- 1. Notched 16-bit pennant sky banner (exact 1:1 pixel scale) -->
      <g [attr.transform]="'translate(0, ' + b.bannerY + ')'">
        <path
          class="banner-border"
          [attr.d]="
            'M0 2h' +
            b.bannerWidth +
            'v11H0v-1h1v-1h1v-1h1V5H2V4H1V3H0z'
          "
        />
        <path
          class="banner-bg"
          [attr.d]="
            'M2 3h' +
            (b.bannerWidth - 3) +
            'v9H2v-1h1v-1h1V5H3V4H2z'
          "
        />
      </g>
      <path class="banner-text" [attr.d]="b.textPath" />

      <!-- 2. Pixel tow-rope bridling banner to craft -->
      <g [attr.transform]="'translate(' + b.ropeX + ', ' + b.bannerY + ')'">
        <path class="blimp-stripe" d="M0 4h1v1h-1zM0 10h1v1h-1zM1 5h1v1h-1zM1 9h1v1h-1zM2 6h1v3h-1zM3 7h2v1h-2zM6 7h2v1h-2z" />
      </g>

      <!-- 3. Craft: pixel blimp by default; Halloween witch on broomstick; Christmas swaps to Santa's sleigh + 3 reindeer at night -->
      <g [attr.transform]="'translate(' + b.blimpX + ', 0)'">
        @if (holiday() !== 'halloween') {
          <g class="blimp-craft" [attr.transform]="'translate(0, ' + b.craftY + ')'">
            <path class="blimp-fin" d="M2 1h5v2h-3v1h-2zM2 11h2v1h3v2h-5z" />
            <path
              class="blimp-hull"
              d="M7 3h16v1h4v1h3v1h2v3h-2v1h-3v1h-4v1h-16v-1h-3v-1h-2v-5h2v-1h3z"
            />
            <path class="blimp-hi" d="M9 4h12v1h-12z" />
            <path class="blimp-stripe" d="M3 7h28v1h-28z" />
            <rect x="0" y="5" width="1" height="5" class="blimp-dark" />
            <path class="blimp-dark" d="M13 12h9v3h-9z" />
            <path class="blimp-win" d="M14 13h2v1h-2zM17 13h2v1h-2zM20 13h1v1h-1z" />
          </g>
        }

        @if (holiday() === 'halloween') {
          <!-- Flying pixel witch on broomstick with perched black cat & magic sparkles (day & night) -->
          <g class="witch-craft">
            <!-- Trailing magic sparkles -->
            <path class="witch-magic" d="M1 7h1v1h-1zM4 6h1v1h-1zM6 17h1v1h-1zM12 16h1v1h-1zM35 8h1v1h-1z" />

            <!-- Broomstick bristles, golden binding & wooden shaft -->
            <path class="witch-straw" d="M2 10h3v1h-3zM1 11h8v1h-8zM0 12h9v2h-9zM1 14h8v1h-8zM2 15h3v1h-3z" />
            <path class="witch-wood" d="M2 12h3v1h-3zM3 14h3v1h-3zM9 12h16v2h-16zM25 11h7v2h-7zM32 10h3v2h-3z" />
            <path class="witch-gold" d="M8 11h1v4h-1z" />

            <!-- Perched black cat riding behind the witch -->
            <path class="witch-dark" d="M8 7h1v1h-1zM9 8h1v3h-1zM10 10h3v2h-3zM11 8h3v2h-3zM11 7h1v1h-1zM13 7h1v1h-1z" />
            <rect x="13" y="8" width="1" height="1" class="witch-gold" />

            <!-- Billowing purple cloak & skirt -->
            <path class="witch-purple" d="M18 9h5v4h-5zM15 10h4v3h-4zM13 11h3v2h-3zM19 13h5v2h-5z" />
            <!-- Windblown hair & face profile -->
            <path class="witch-hair" d="M17 6h4v2h-4zM15 7h3v2h-3zM16 8h4v1h-4z" />
            <path class="witch-skin" d="M21 6h4v3h-4zM25 7h1v1h-1zM26 11h2v1h-2z" />
            <!-- Dark bodice, arm, crooked pointy hat & curled boot -->
            <path
              class="witch-dark"
              d="M16 1h3v1h-3zM18 2h4v1h-4zM19 3h5v1h-5zM17 5h10v1h-10zM24 6h1v1h-1z
                 M20 9h4v4h-4zM24 10h3v1h-3zM21 16h4v1h-4zM25 15h1v1h-1z"
            />
            <!-- Hat band, gold buckle & striped stocking -->
            <path class="witch-purple" d="M19 4h6v1h-6z" />
            <path class="witch-gold" d="M23 4h2v1h-2zM21 15h2v1h-2z" />
          </g>
        }

        @if (holiday() === 'christmas') {
          <!-- Night-only (Dark mode via light-dark()) Detailed Santa Claus, ornate sleigh, toy sack & 3 galloping reindeer (Rudolph leading) -->
          <g class="santa-craft">
            <!-- Magic stardust sparkles trailing behind the runners -->
            <path class="santa-sparkle" d="M0 15h1v1h-1zM2 21h1v1h-1zM9 21h1v1h-1z" />

            <!-- Burlap toy sack & overflowing presents behind Santa -->
            <path class="santa-sack" d="M4 9h5v4h-5zM5 8h3v1h-3z" />
            <path class="santa-green" d="M3 7h3v3h-3z" />
            <path class="santa-gold" d="M4 7h1v3h-1zM3 8h3v1h-3z" />
            <path class="santa-white" d="M7 6h2v1h-2zM7 7h1v2h-1z" />
            <path class="santa-red" d="M8 6h1v1h-1zM7 8h1v1h-1z" />

            <!-- Santa Claus: hat, face, rosy nose, full white beard, coat, fur trim, belt & buckle -->
            <path class="santa-red" d="M11 3h3v1h-3zM10 4h4v1h-4zM12 5h3v1h-3zM15 8h1v1h-1zM10 10h7v3h-7z" />
            <path class="santa-skin" d="M12 7h3v2h-3z" />
            <path class="santa-dark" d="M14 7h1v1h-1zM10 11h6v1h-6zM17 10h1v1h-1z" />
            <path class="santa-white" d="M9 5h1v2h-1zM11 6h5v1h-5zM11 9h5v1h-5zM13 10h3v1h-3zM10 12h6v1h-6zM16 10h1v1h-1z" />
            <path class="santa-gold" d="M13 11h2v1h-2z" />

            <!-- Ornate crimson sleigh body, curved backrest & swept dashboard -->
            <path class="santa-red" d="M1 10h2v2h-2zM2 12h2v5h-2zM3 13h15v4h-15zM17 11h2v5h-2zM19 10h1v3h-1z" />
            <path class="santa-dark" d="M4 16h14v1h-14z" />

            <!-- Golden sleigh runners, struts, filigree trim & harness reins across all 3 reindeer -->
            <path
              class="santa-gold"
              d="M0 18h1v1h-1zM1 19h19v1h-19zM20 18h1v1h-1zM21 16h1v2h-1zM20 15h1v1h-1z
                 M5 17h1v2h-1zM15 17h1v2h-1zM1 9h2v1h-2zM18 10h2v1h-2zM3 14h15v1h-15z
                 M18 10h3v1h-3zM21 11h8v1h-8zM31 11h4v1h-4zM35 10h4v1h-4zM39 9h3v1h-3z
                 M44 9h4v1h-4zM48 8h4v1h-4zM52 7h3v1h-3z"
            />

            <!-- Reindeer 1 (rear, x=23..34, y=6..18) -->
            <path class="santa-antler" d="M30 7h1v2h-1zM29 6h1v1h-1zM31 6h1v1h-1zM32 7h1v2h-1zM33 6h1v1h-1z" />
            <path
              class="santa-deer"
              d="M25 12h6v3h-6zM29 10h2v3h-2zM30 9h4v2h-4zM29 9h1v1h-1z
                 M25 15h1v1h-1zM24 16h1v1h-1zM26 15h1v2h-1zM30 15h1v1h-1zM31 16h2v1h-2zM29 15h1v2h-1z"
            />
            <path class="santa-white" d="M26 14h4v1h-4zM24 12h1v1h-1z" />
            <path class="santa-red" d="M29 11h2v1h-2z" />
            <path class="santa-gold" d="M31 12h1v1h-1z" />
            <path class="santa-dark" d="M32 9h1v1h-1zM33 10h1v1h-1zM23 17h1v1h-1zM26 17h1v1h-1zM33 16h1v1h-1zM29 17h1v1h-1z" />

            <!-- Reindeer 2 (middle, soaring slightly higher, x=36..47, y=4..16) -->
            <path class="santa-antler" d="M43 5h1v2h-1zM42 4h1v1h-1zM44 4h1v1h-1zM45 5h1v2h-1zM46 4h1v1h-1z" />
            <path
              class="santa-deer"
              d="M38 10h6v3h-6zM42 8h2v3h-2zM43 7h4v2h-4zM42 7h1v1h-1z
                 M38 13h1v1h-1zM37 14h1v1h-1zM39 13h1v2h-1zM43 13h1v1h-1zM44 14h2v1h-2zM42 13h1v2h-1z"
            />
            <path class="santa-white" d="M39 12h4v1h-4zM37 10h1v1h-1z" />
            <path class="santa-red" d="M42 9h2v1h-2z" />
            <path class="santa-gold" d="M44 10h1v1h-1z" />
            <path class="santa-dark" d="M45 7h1v1h-1zM46 8h1v1h-1zM36 15h1v1h-1zM39 15h1v1h-1zM46 14h1v1h-1zM42 15h1v1h-1z" />

            <!-- Reindeer 3: Lead Rudolph soaring highest up front (x=49..62, y=2..14) -->
            <path class="santa-antler" d="M56 3h1v2h-1zM55 2h1v1h-1zM57 2h1v1h-1zM58 3h1v2h-1zM59 2h1v1h-1z" />
            <path
              class="santa-deer"
              d="M51 8h6v3h-6zM55 6h2v3h-2zM56 5h4v2h-4zM55 5h1v1h-1z
                 M51 11h1v1h-1zM50 12h1v1h-1zM52 11h1v2h-1zM56 11h1v1h-1zM57 12h2v1h-2zM55 11h1v2h-1z"
            />
            <path class="santa-white" d="M52 10h4v1h-4zM50 8h1v1h-1z" />
            <path class="santa-red" d="M55 7h2v1h-2z" />
            <path class="santa-gold" d="M57 8h1v1h-1z" />
            <path class="santa-dark" d="M58 5h1v1h-1zM49 13h1v1h-1zM52 13h1v1h-1zM59 12h1v1h-1zM55 13h1v1h-1z" />
            <!-- Rudolph's glowing crimson nose + night halo -->
            <path class="santa-nose-glow" d="M59 5h3v3h-3z" />
            <rect x="60" y="6" width="1" height="1" class="santa-nose" />
          </g>
        }

        @if (holiday() === 'diwali') {
          <!-- Night-only (Dark mode via light-dark()) Indian Diwali firework skyrocket with roaring plume & sparks -->
          <g class="rocket-craft">
            <!-- Soft warm night aura & trailing golden/rani-pink firework sparks -->
            <path class="rocket-glow" d="M1 8h12v7H1zM4 7h8v9H4z" />
            <path
              class="santa-gold"
              d="M0 8h1v1H0zM2 6h1v1H2zM1 14h1v1H1zM3 16h1v1H3zM6 5h1v1H6zM6 17h1v1H6z"
            />
            <path class="rocket-magenta" d="M1 9h1v1H1zM4 15h1v1H4zM9 5h1v1H9zM8 16h1v1H8z" />
            <path class="santa-white" d="M3 8h1v1H3zM5 13h1v1H5z" />

            <!-- Layered saffron -> gold -> white-hot exhaust jet plume -->
            <path class="rocket-amber" d="M2 11h3v1H2zM4 10h5v3H4zM7 9h6v5H7zM10 8h3v7h-3z" />
            <path class="santa-gold" d="M5 11h3v1H5zM7 10h6v3H7zM10 9h3v5h-3z" />
            <path class="santa-white" d="M9 11h4v1H9zM11 10h2v3h-2z" />

            <!-- Flared exhaust nozzle & swept crimson-and-gold delta tail fins -->
            <path class="santa-dark" d="M13 9h2v5h-2zM14 10h2v3h-2z" />
            <path
              class="santa-red"
              d="M15 4h3v1h-3zM16 5h4v1h-4zM17 6h5v2h-5z
                 M17 15h5v2h-5zM16 17h4v1h-4zM15 18h3v1h-3z"
            />
            <path
              class="santa-gold"
              d="M18 4h1v1h-1zM20 5h1v1h-1zM22 6h1v2h-1z
                 M22 15h1v2h-1zM20 17h1v1h-1zM18 18h1v1h-1z"
            />

            <!-- Festive saffron body, rani-magenta & gold chevrons, collars & star emblem -->
            <path class="rocket-amber" d="M15 8h17v7H15z" />
            <path class="rocket-crimson" d="M15 14h17v1H15z" />
            <path
              class="santa-gold"
              d="M17 8h14v1H17zM16 8h1v7h-1zM31 8h1v7h-1z
                 M24 9h2v1h-2zM25 10h2v1h-2zM26 11h2v1h-2zM25 12h2v1h-2zM24 13h2v1h-2z"
            />
            <path
              class="rocket-magenta"
              d="M19 9h2v1h-2zM20 10h2v1h-2zM21 11h2v1h-2zM20 12h2v1h-2zM19 13h2v1h-2z"
            />
            <path class="santa-white" d="M29 10h1v3h-1zM28 11h3v1h-3z" />

            <!-- Tapered crimson-and-gold conical warhead -->
            <path class="santa-red" d="M32 9h3v5h-3zM35 10h3v3h-3zM38 11h2v1h-2z" />
            <path class="santa-gold" d="M34 9h1v5h-1zM40 11h1v1h-1zM32 9h2v1h-2zM35 10h2v1h-2z" />
          </g>
        }
      </g>
    </svg>
  </div>
}
